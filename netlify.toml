[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = """
default-src 'self';
script-src 'self';
style-src 'self';
img-src 'self' data:;
font-src 'self' https://fonts.gstatic.com;
connect-src 'self';
object-src 'none';
base-uri 'self';
form-action 'self';
frame-ancestors 'none';
upgrade-insecure-requests;
"""